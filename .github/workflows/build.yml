# ============================================================
#  PMT Planer — automatyczne budowanie wydań (Windows / macOS / Linux)
#
#  JAK TO DZIAŁA:
#  1. Wypychasz tag zaczynający się od "v" (np. przez Releases → Draft
#     a new release → tag v3.13.3 → Publish).
#  2. GitHub buduje program na trzech systemach i dołącza do wydania:
#        PMT_Planer.Windows.zip   <- ZAWSZE PIERWSZY na liście
#        PMT_Planer_macOS.zip
#        PMT_Planer_Linux.zip
#
#  DLACZEGO WINDOWS MA KROPKĘ W NAZWIE (nie "_Windows"):
#  Starsze wersje programu (3.12.x) pobierają PIERWSZE archiwum z wydania,
#  bez sprawdzania systemu. Kropka sortuje się przed podkreśleniem, więc
#  "PMT_Planer.Windows.zip" trafia na początek listy i stare instalacje
#  pobierają właściwy plik. Dodatkowo paczkę Windows dołącza do wydania
#  job wydanie_windows, a macOS/Linux — wydanie_pozostale, który na niego
#  czeka przez "needs", więc kolejność wysyłki też się zgadza.
#  Nowsze wersje (3.13.2+) i tak szukają nazwy zawierającej "windows".
#
#  3. Gdy paczka Windows jest już w wydaniu, ostatni krok (job „wersja")
#     sam wpisuje numer do wersja.txt — patrz komentarz przy tym jobie.
#
#  ZAPIS DO REPOZYTORIUM mają TYLKO joby wydanie_windows, wydanie_pozostale
#  i wersja — żaden z nich nie instaluje niczego z PyPI. Joby budujące mają
#  token tylko do odczytu i nie zostawiają go w .git/config
#  (persist-credentials: false): pip uruchamia przy instalacji kod pobrany
#  z PyPI (fontTools buduje się ze źródeł), a token z prawem zapisu pozwoliłby
#  mu wypchnąć na main np. updater.bat, który programy pobierają i uruchamiają.
#  Paczki przechodzą między jobami przez Artifacts przebiegu.
#
#  CZYM BUDUJEMY: na każdym systemie tym samym poleceniem, co na komputerze:
#     python zbuduj.py --folder
#  Lista modułów (nowy wygląd, okno logowania, dokumenty, podpis, wysyłka,
#  widżety z prototyp/), pliki dodatkowe, ikona, --onedir, --noupx
#  i metadane .exe siedzą TYLKO w zbuduj.py. Ten plik nie ma własnej listy
#  --hidden-import — do 3.22.0 miał, krótszą, i paczki z GitHuba nie
#  zawierały nowego wyglądu ani nowego okna logowania.
#
#  GDZIE WGRAĆ TEN PLIK: .github/workflows/build.yml
#
#  UWAGA: budujemy na Pythonie 3.13 (nie 3.14) — celowo, patrz problem
#  z python314.dll na maszynach użytkowników.
# ============================================================
name: Buduj wydanie

permissions:
  contents: read

on:
  push:
    tags:
      - "v*"        # np. v3.13.6
      - "[0-9]*"    # np. 3.13.6 — tag bez litery "v" tez uruchomi budowanie
  workflow_dispatch:

jobs:
  # ---------- 0) TESTY — paczka z tagu powstaje tylko z kodu, który je przechodzi ----------
  # testy.yml sam nie startuje dla tagu (push: branches), a tag może wskazywać
  # commit wypchnięty prosto na main, którego testy jeszcze biegną albo padły.
  # Budowanie testowe (Run workflow) nie czeka na testy — jak dotąd.
  testy:
    if: startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/testy.yml

  # ---------- 1) WINDOWS — buduje się i wysyła jako pierwszy ----------
  windows:
    needs: testy
    # !cancelled(): pominięte testy (budowanie ręczne) nie zatrzymują paczki testowej
    if: ${{ !cancelled() && (needs.testy.result == 'success' || !startsWith(github.ref, 'refs/tags/')) }}
    runs-on: windows-latest
    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Zainstaluj Pythona 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Zainstaluj zależności
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Kontrola - fontTools bez modulow natywnych
        shell: bash
        run: |
          # requirements.txt ma "--no-binary fonttools". Gdyby to kiedys
          # przestalo dzialac, paczka znow niosłaby niepodpisane .pyd, ktore
          # Windows blokuje ("Zasady kontroli aplikacji", 3.21.3). Wolimy
          # czerwone budowanie niz czerwone okno u uzytkownika.
          python - <<'PY'
          import fontTools, glob, os, sys
          d = os.path.dirname(fontTools.__file__)
          nat = glob.glob(d + "/**/*.pyd", recursive=True) + glob.glob(d + "/**/*.so", recursive=True)
          print("fontTools", fontTools.version, "modulow natywnych:", len(nat))
          if nat:
              print("::error::fontTools ma skompilowane moduly:", nat)
              sys.exit(1)
          PY
      - name: Przelozony z sekretu repozytorium
        shell: bash
        env:
          PMT_MENEDZER: ${{ secrets.PMT_MENEDZER }}
          BEZ_MENEDZERA_OK: ${{ vars.PMT_MENEDZER_OPCJONALNY }}
        run: |
          # Nazwisko przelozonego NIE jest w repozytorium (.gitignore). Do paczki
          # trafia z sekretu: Settings -> Secrets and variables -> Actions ->
          # New repository secret -> nazwa PMT_MENEDZER, wartosc = imie i nazwisko.
          if [ -n "$PMT_MENEDZER" ]; then
            printf '%s\n' "$PMT_MENEDZER" > menedzer.txt
            echo "menedzer.txt: utworzony z sekretu PMT_MENEDZER"
          elif [ "$BEZ_MENEDZERA_OK" = "tak" ]; then
            echo "UWAGA: brak sekretu PMT_MENEDZER - rubryka PRZELOZONY bedzie pusta"
            echo "       (zmienna PMT_MENEDZER_OPCJONALNY=tak: buduje mimo to)."
          else
            # Wydanie 3.21.2 poszlo do ludzi z PUSTA rubryka, bo ten krok tylko
            # ostrzegal, a ostrzezenia w logu nikt nie czyta. Od teraz brak
            # nazwiska ZATRZYMUJE budowanie - paczka bez przelozonego nie ma
            # prawa trafic do wydania po cichu.
            echo "::error::Brak sekretu PMT_MENEDZER. Ustaw go: Settings -> Secrets and variables -> Actions -> New repository secret (nazwa PMT_MENEDZER, wartosc = imie i nazwisko przelozonego), potem uruchom to budowanie ponownie (Re-run jobs). Jesli NAPRAWDE chcesz paczke bez nazwiska: Settings -> Secrets and variables -> Actions -> Variables -> New repository variable PMT_MENEDZER_OPCJONALNY = tak."
            exit 1
          fi

      - name: Sekret aplikacji z sekretu repozytorium
        shell: bash
        env:
          PMT_SEKRET: ${{ secrets.PMT_SEKRET }}
          BEZ_SEKRETU_OK: ${{ vars.PMT_SEKRET_OPCJONALNY }}
        run: |
          # Wspolny sekret aplikacji (klucz HMAC, ktorym program podpisuje
          # zapytania puls/sesja/reset_hasla do backendu) NIE jest w kodzie ani
          # w repozytorium (.gitignore) - do 3.23.0 byl literalem
          # w PMT_Delegacje.py. Do paczki trafia z sekretu: Settings -> Secrets
          # and variables -> Actions -> New repository secret -> nazwa PMT_SEKRET,
          # wartosc = ten sam napis, co w SEKRETY_PMT w Apps Script
          # (procedura obrotu: BACKEND_APPS_SCRIPT.txt).
          if [ -n "$PMT_SEKRET" ]; then
            printf '%s\n' "$PMT_SEKRET" > sekret.txt
            echo "sekret.txt: utworzony z sekretu PMT_SEKRET"
          elif [ "$BEZ_SEKRETU_OK" = "tak" ]; then
            echo "UWAGA: brak sekretu PMT_SEKRET - program nie podpisze zapytan, backend"
            echo "       odrzuci puls, sesje i reset hasla (zmienna PMT_SEKRET_OPCJONALNY=tak: buduje mimo to)."
          else
            # Paczka bez sekretu loguje, ale kazdy puls i kazdy reset hasla dostaje
            # od backendu "odmowa" - i nikt tego w logu budowania nie zauwazy.
            # Dlatego brak sekretu ZATRZYMUJE budowanie, tak jak brak nazwiska.
            echo "::error::Brak sekretu PMT_SEKRET. Ustaw go: Settings -> Secrets and variables -> Actions -> New repository secret (nazwa PMT_SEKRET, wartosc = sekret aplikacji z listy SEKRETY_PMT w Apps Script; procedura: BACKEND_APPS_SCRIPT.txt), potem uruchom to budowanie ponownie (Re-run jobs). Paczka bez sekretu nie podpisuje zapytan - backend odrzuca puls, sesje i reset hasla. Jesli NAPRAWDE chcesz taka paczke: Settings -> Secrets and variables -> Actions -> Variables -> New repository variable PMT_SEKRET_OPCJONALNY = tak."
            exit 1
          fi

      - name: Kontrola - paczka z tagu bez etykiety testowej
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          # ETYKIETA_WYDANIA niesie napis dla testera ("WERSJA TESTOWA") i widac
          # go w pasku okna oraz obok numeru wersji. W paczce z TAGU, ktora idzie
          # do calego zespolu, musi byc PUSTA. 3.23.0 szykowalo sie z ta etykieta
          # ustawiona (paczki szly do testera) - bez tej kontroli wszyscy
          # zobaczyliby "PMT Planer - WERSJA TESTOWA" w pasku okna.
          # UWAGA: grep -m1 MUSI byc PIERWSZY w potoku, czytajac plik bezposrednio.
          # Odwrotna kolejnosc (tr najpierw) kazala "tr" przepychac cale ~18 tys.
          # linii, a "grep -m1" urywal potok juz przy dopasowaniu w linii ~2555 -
          # "tr" dostawal SIGPIPE (exit 141), pipefail wysadzal caly krok mimo ze
          # wynik bylby poprawny (v3.24.0, run 37687543630).
          ETYKIETA=$(grep -m1 -E '^ETYKIETA_WYDANIA *= *' PMT_Delegacje.py | tr -d '\r' | sed -E 's/^[^=]*= *//')
          echo "ETYKIETA_WYDANIA w zrodle: [$ETYKIETA]"
          if [ "$ETYKIETA" != '""' ] && [ "$ETYKIETA" != "''" ]; then
            echo "::error::Paczka z tagu ma ustawiona ETYKIETA_WYDANIA=$ETYKIETA - caly zespol zobaczylby ten napis w pasku okna. W PMT_Delegacje.py ustaw ETYKIETA_WYDANIA = \"\" (pusty napis), wypchnij zmiane i otaguj ponownie."
            exit 1
          fi

      - name: Zbuduj program
        shell: bash
        env:
          PYTHONUTF8: "1"
        run: |
          # JEDNO ZRODLO PRAWDY: buduje zbuduj.py — ten sam skrypt, ktory na
          # komputerze uruchamia ZBUDUJ_EXE_FOLDER.bat. Tam (i tylko tam) jest:
          #  · lista modulow importowanych wewnatrz funkcji (karta
          #    testera, glebia 3D, dokumenty, podpis, wysylka, NOWY WYGLAD,
          #    okno logowania, logo retro, widzety z prototyp\) — podawana
          #    wprost, zeby zadna zmiana w analizie PyInstallera ich nie zgubila,
          #  · pliki dodatkowe (tla, logo, menedzer.txt, sekret.txt; brak pliku nie
          #    przerywa budowania — program ma tlo zastepcze),
          #  · --onedir  : program NIE rozpakowuje sie przy starcie, biblioteki
          #                leza obok .exe — koniec z "Failed to load Python DLL",
          #  · --noupx   : spakowany UPX-em .exe to najczestsza przyczyna
          #                falszywych alarmow antywirusa,
          #  · --version-file wersja_exe.txt : metadane .exe (bez nich plik
          #                wyglada dla SmartScreen jak anonimowy plik z sieci);
          #                numer w nich zbuduj.py uzgadnia ze zrodlem.
          # Po budowie zbuduj.py sprawdza w build/PMT_Planer/PYZ-00.toc, czy
          # KAZDY wlasny modul trafil do paczki, i doklada do dist/PMT_Planer
          # URUCHOM_PMT.bat, 0_NAJPIERW_ROZPAKUJ_CALY_FOLDER.txt i pmt_wersja.txt.
          python zbuduj.py --folder

      - name: Raport budowania (tylko gdy cos padlo)
        if: failure()
        shell: bash
        run: tail -n 120 BUDOWANIE_log.txt || true

      - name: Sprawdź, czy program powstał
        shell: bash
        run: |
          test -f dist/PMT_Planer/PMT_Planer.exe || { echo "BRAK dist/PMT_Planer/PMT_Planer.exe"; exit 1; }
          ls -la dist/PMT_Planer/ | head -20

      - name: Spakuj do zip
        shell: bash
        run: |
          # W archiwum ma byc FOLDER "PMT_Planer" z plikiem .exe i katalogiem
          # _internal. Aktualizator rozpoznaje ten uklad i podmienia caly folder.
          # zbuduj.py dolozyl juz do folderu (sprawdzamy, nie powtarzamy):
          #  · URUCHOM_PMT.bat — skrypt pierwszego uruchomienia, zdejmuje
          #    znacznik "plik z internetu", ktory blokuje start programu;
          #  · 0_NAJPIERW_ROZPAKUJ_CALY_FOLDER.txt — podpowiedz dla kogos, kto
          #    otworzy ZIP w Eksploratorze i kliknie program W SRODKU archiwum
          #    (blad "Failed to load Python DLL ... python313.dll", 3.21.1);
          #  · pmt_wersja.txt — znacznik wersji W PACZCE; bez niego zadna
          #    kopia programu nie pozna, ze folder obok jest NOWSZY od niej.
          # UWAGA: korzen archiwum to nadal DOKLADNIE JEDEN folder PMT_Planer.
          # Aktualizator w 3.21.0/3.21.1 wchodzi do srodka tylko wtedy, gdy
          # w korzeniu jest jeden wpis - luzny plik w korzeniu zepsulby im
          # aktualizacje. Dlatego podpowiedz lezy W folderze, nie obok.
          for P in URUCHOM_PMT.bat 0_NAJPIERW_ROZPAKUJ_CALY_FOLDER.txt pmt_wersja.txt; do
            test -f "dist/PMT_Planer/$P" || { echo "::error::zbuduj.py nie dolozyl $P do dist/PMT_Planer"; exit 1; }
          done
          echo "znacznik wersji: $(cat dist/PMT_Planer/pmt_wersja.txt)"
          cd dist
          7z a ../PMT_Planer.Windows.zip PMT_Planer
          cd ..
          7z l PMT_Planer.Windows.zip | head -25

      # Do wydania paczkę dołącza job wydanie_windows (ten job nie ma prawa zapisu).
      - name: Przekaż paczkę do wydania
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: wydanie-Windows
          path: PMT_Planer.Windows.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

      # BUDOWANIE TESTOWE (Actions -> Buduj wydanie -> Run workflow): ta sama
      # paczka, co w wydaniu, ale NIE trafia do Releases i NIE rusza wersja.txt
      # — nikt z zespolu jej nie zobaczy. Lezy 7 dni w przebiegu, w sekcji
      # Artifacts, do pobrania i sprawdzenia na Windows przed wydaniem.
      - name: Paczka testowa (tylko budowanie reczne, bez wydania)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: PMT_Planer_TEST_Windows
          path: dist/PMT_Planer
          retention-days: 7

  # ---------- 1b) paczka Windows do wydania — bez instalowania czegokolwiek ----------
  wydanie_windows:
    needs: windows
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Pobierz paczkę z joba windows
        uses: actions/download-artifact@v4
        with:
          name: wydanie-Windows

      - name: Dołącz do wydania
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          test -f PMT_Planer.Windows.zip || { echo "::error::Brak PMT_Planer.Windows.zip z joba windows"; exit 1; }
          # Zwykle wydanie juz jest (Publish release). Dla tagu wypchnietego bez
          # wydania tworzymy je tu - tak, jak robila to wczesniej akcja
          # softprops/action-gh-release (tytul = tag, pusty opis).
          gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --verify-tag --title "$TAG" --notes ""
          gh release upload "$TAG" PMT_Planer.Windows.zip --clobber

  # ---------- 2) macOS i Linux — dopiero po Windows, tylko w wydaniu ----------
  pozostale:
    needs: windows
    # Budowanie testowe sprawdza tylko paczke Windows — macOS i Linux
    # buduja sie wylacznie dla prawdziwego wydania (tag).
    if: startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            nazwa: macOS
          - os: ubuntu-22.04
            nazwa: Linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Zainstaluj Pythona 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Zainstaluj zależności
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Biblioteki systemowe (tylko Linux)
        if: matrix.nazwa == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - name: Przelozony z sekretu repozytorium
        shell: bash
        env:
          PMT_MENEDZER: ${{ secrets.PMT_MENEDZER }}
          BEZ_MENEDZERA_OK: ${{ vars.PMT_MENEDZER_OPCJONALNY }}
        run: |
          # Ten sam krok, co w jobie windows. Do 3.23.0 byl TYLKO tam, wiec
          # paczki macOS i Linux wychodzily bez menedzer.txt i rubryka
          # PRZELOZONY na delegacji byla w nich pusta - dokladnie ta awaria,
          # ktora w wydaniu 3.21.2 zaliczyl juz Windows.
          if [ -n "$PMT_MENEDZER" ]; then
            printf '%s\n' "$PMT_MENEDZER" > menedzer.txt
            echo "menedzer.txt: utworzony z sekretu PMT_MENEDZER"
          elif [ "$BEZ_MENEDZERA_OK" = "tak" ]; then
            echo "UWAGA: brak sekretu PMT_MENEDZER - rubryka PRZELOZONY bedzie pusta"
            echo "       (zmienna PMT_MENEDZER_OPCJONALNY=tak: buduje mimo to)."
          else
            echo "::error::Brak sekretu PMT_MENEDZER. Ustaw go: Settings -> Secrets and variables -> Actions -> New repository secret (nazwa PMT_MENEDZER, wartosc = imie i nazwisko przelozonego), potem uruchom to budowanie ponownie (Re-run jobs). Jesli NAPRAWDE chcesz paczke bez nazwiska: Settings -> Secrets and variables -> Actions -> Variables -> New repository variable PMT_MENEDZER_OPCJONALNY = tak."
            exit 1
          fi

      - name: Sekret aplikacji z sekretu repozytorium
        shell: bash
        env:
          PMT_SEKRET: ${{ secrets.PMT_SEKRET }}
          BEZ_SEKRETU_OK: ${{ vars.PMT_SEKRET_OPCJONALNY }}
        run: |
          # Ten sam krok, co w jobie windows (paczki macOS/Linux tez podpisuja
          # zapytania). Wspolny sekret aplikacji (klucz HMAC, ktorym program podpisuje
          # zapytania puls/sesja/reset_hasla do backendu) NIE jest w kodzie ani
          # w repozytorium (.gitignore) - do 3.23.0 byl literalem
          # w PMT_Delegacje.py. Do paczki trafia z sekretu: Settings -> Secrets
          # and variables -> Actions -> New repository secret -> nazwa PMT_SEKRET,
          # wartosc = ten sam napis, co w SEKRETY_PMT w Apps Script
          # (procedura obrotu: BACKEND_APPS_SCRIPT.txt).
          if [ -n "$PMT_SEKRET" ]; then
            printf '%s\n' "$PMT_SEKRET" > sekret.txt
            echo "sekret.txt: utworzony z sekretu PMT_SEKRET"
          elif [ "$BEZ_SEKRETU_OK" = "tak" ]; then
            echo "UWAGA: brak sekretu PMT_SEKRET - program nie podpisze zapytan, backend"
            echo "       odrzuci puls, sesje i reset hasla (zmienna PMT_SEKRET_OPCJONALNY=tak: buduje mimo to)."
          else
            # Paczka bez sekretu loguje, ale kazdy puls i kazdy reset hasla dostaje
            # od backendu "odmowa" - i nikt tego w logu budowania nie zauwazy.
            # Dlatego brak sekretu ZATRZYMUJE budowanie, tak jak brak nazwiska.
            echo "::error::Brak sekretu PMT_SEKRET. Ustaw go: Settings -> Secrets and variables -> Actions -> New repository secret (nazwa PMT_SEKRET, wartosc = sekret aplikacji z listy SEKRETY_PMT w Apps Script; procedura: BACKEND_APPS_SCRIPT.txt), potem uruchom to budowanie ponownie (Re-run jobs). Paczka bez sekretu nie podpisuje zapytan - backend odrzuca puls, sesje i reset hasla. Jesli NAPRAWDE chcesz taka paczke: Settings -> Secrets and variables -> Actions -> Variables -> New repository variable PMT_SEKRET_OPCJONALNY = tak."
            exit 1
          fi

      - name: Zbuduj program
        shell: bash
        env:
          PYTHONUTF8: "1"
        run: |
          # To samo polecenie, co na Windows i na komputerze — patrz komentarz
          # przy jobie windows. Ikone zbuduj.py dobiera do systemu
          # (macOS: pmt_logo.icns; Linux nie ma ikony w pliku programu).
          python zbuduj.py --folder

      - name: Raport budowania (tylko gdy cos padlo)
        if: failure()
        shell: bash
        run: tail -n 120 BUDOWANIE_log.txt || true

      - name: Spakuj do zip
        shell: bash
        run: |
          cd dist
          zip -r ../PMT_Planer_${{ matrix.nazwa }}.zip PMT_Planer

      - name: Przekaż paczkę do wydania
        uses: actions/upload-artifact@v4
        with:
          name: wydanie-inne-${{ matrix.nazwa }}
          path: PMT_Planer_${{ matrix.nazwa }}.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  # ---------- 2b) paczki macOS/Linux do wydania — PO paczce Windows ----------
  wydanie_pozostale:
    needs: [wydanie_windows, pozostale]
    # Bez always()/!cancelled() czerwony macOS zatrzymalby tez paczke Linux
    # (i odwrotnie) - a do 3.25.0 kazda trafiala do wydania osobno (fail-fast: false).
    if: ${{ !cancelled() && needs.wydanie_windows.result == 'success' && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Pobierz paczki z joba pozostale
        uses: actions/download-artifact@v4
        with:
          pattern: wydanie-inne-*
          merge-multiple: true

      - name: Dołącz do wydania
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          shopt -s nullglob
          PACZKI=(PMT_Planer_*.zip)
          if [ ${#PACZKI[@]} -eq 0 ]; then
            echo "::error::Brak paczek macOS/Linux - oba budowania (job pozostale) padly."
            exit 1
          fi
          for P in "${PACZKI[@]}"; do gh release upload "$TAG" "$P" --clobber; done

  # ---------- 3) wersja.txt — DOPIERO gdy paczka Windows jest w wydaniu ----------
  # Do 3.21.2 numer podbijał osobny automat (wersja_auto.yml) reagujący na
  # zdarzenie „Publish release". Dwie wady, obie zaliczone w praktyce:
  #  · wydanie utworzone przez EDYCJĘ starego wpisu w Releases (zmiana tagu
  #    i tytułu) nie wysyła „published" — automat nie uruchomił się ani razu
  #    przy 3.21.0 i 3.21.1;
  #  · przy prawdziwym „Publish" podbijał wersja.txt NATYCHMIAST, kilka minut
  #    PRZED dołączeniem paczki — program u ludzi pobierał wtedy poprzednią
  #    paczkę i widział aktualizację od nowa, w kółko.
  # Teraz numer trafia do wersja.txt tu: po zbudowaniu i wysłaniu paczki
  # Windows, na każdy tag — niezależnie od tego, jak powstało wydanie.
  # !cancelled(), nie always(): czerwony macOS/Linux nie zatrzymuje numeru (Windows
  # już jest w wydaniu), ale „Cancel workflow” ma zatrzymać wydanie — always()
  # puszczało ten job także po anulowaniu.
  wersja:
    needs: [wydanie_windows, wydanie_pozostale]
    if: ${{ !cancelled() && needs.wydanie_windows.result == 'success' && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Pobierz main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Podbij wersja.txt
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git fetch --no-tags origin "+refs/tags/$TAG:refs/tags/$TAG"
          # Numer bierzemy ze ZRODLA na tagu — to on siedzi w zbudowanej paczce
          # i to z nim program porownuje wersja.txt. Tag jest tylko zapasem.
          # Ten sam wzorzec co w jobie "windows" (patrz tamten komentarz) - grep -m1
          # zaraz za duzym producentem w potoku ("git show" calego pliku) potrafi
          # go SIGPIPE'owac w polowie. Tu "|| true" dotad maskowalo skutek po cichu
          # (NUMER i tak wychodzil poprawny, bo grep zdazal wypisac dopasowanie,
          # zanim proces wyzej w potoku dostal sygnal) - to byla przypadkowa
          # poprawnosc, nie gwarancja. Materializujemy do pliku tymczasowego, zeby
          # grep -m1 czytal PRAWDZIWY plik (jak w jobie "windows") - wtedy nikt nie
          # pisze do potoku, wiec nie ma komu dostac SIGPIPE.
          TMP_SRC="$(mktemp)"
          git show "refs/tags/$TAG:PMT_Delegacje.py" > "$TMP_SRC" 2>/dev/null || true
          # PIERWSZY napis w cudzyslowie, jak w zbuduj.py (to on trafia do paczki) -
          # zachlanne ".*" bralo OSTATNI, np. z komentarza  # poprzednio "3.25.1".
          NUMER=$(grep -m1 -E '^WERSJA_PROGRAMU *= *"' "$TMP_SRC" | tr -d '\r' | sed -E 's/^WERSJA_PROGRAMU *= *"([^"]+)".*/\1/' || true)
          rm -f "$TMP_SRC"
          if [ -z "$NUMER" ]; then NUMER="${TAG#v}"; fi
          if [ "$NUMER" != "${TAG#v}" ]; then
            echo "::warning::Tag $TAG, a w zrodle WERSJA_PROGRAMU=$NUMER - do wersja.txt idzie numer ze zrodla (ten jest w paczce)."
          fi
          OBECNA=$(head -n1 wersja.txt 2>/dev/null | tr -d '\r' || true)
          # Nie cofamy: przebudowanie starszego tagu nie moze obnizyc numeru.
          if [ -n "$OBECNA" ] && [ "$(printf '%s\n%s\n' "$OBECNA" "$NUMER" | sort -V | tail -n1)" != "$NUMER" ]; then
            echo "wersja.txt ma juz nowszy numer ($OBECNA > $NUMER) - zostawiam."
            exit 0
          fi
          # Raz wpisany numer nie wraca drugi raz: "Re-run failed jobs" (np. po czerwonym
          # macOS) uruchamia ten job ponownie na AKTUALNYM main - po HAMULCU AWARYJNYM
          # (reczne cofniecie pierwszej linii, WYDANIE.txt) po cichu by go odkrecil.
          PODBICIA=$(git log --format=%s -- wersja.txt || true)
          if grep -qxF "wersja.txt -> $NUMER [skip ci]" <<< "$PODBICIA"; then
            if [ "$OBECNA" = "$NUMER" ]; then
              echo "wersja.txt ma juz $NUMER - zostawiam."
            else
              echo "::warning::wersja.txt byl juz podbity do $NUMER, a teraz ma $OBECNA (hamulec awaryjny?) - nie nadpisuje. Jesli $NUMER ma jednak wrocic, wpisz go recznie w pierwszej linii wersja.txt."
            fi
            exit 0
          fi
          # Program szuka paczki przez releases/latest, ktore pomija pre-release i wydania
          # bez znacznika "Latest". Numer bez paczki pod tym adresem = u wszystkich
          # "Na serwerze lezy jeszcze poprzednia paczka" przy kazdym starcie.
          NAJNOWSZE=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" -q .tag_name) || NAJNOWSZE=""
          if [ "$NAJNOWSZE" != "$TAG" ]; then
            echo "::error::Wydanie $TAG nie jest oznaczone jako najnowsze (Latest: ${NAJNOWSZE:-brak}) albo jest pre-release - programy pobralyby inna paczke, wiec wersja.txt zostaje bez zmian. Releases -> $TAG -> Edit: odznacz \"Set as a pre-release\", zaznacz \"Set as the latest release\" -> Update release, potem Re-run failed jobs."
            exit 1
          fi
          OPIS=$(gh release view "$TAG" --json body -q .body 2>/dev/null | tr -d '\r' | grep -m1 . || true)
          OPIS=${OPIS:-"Nowa wersja programu."}
          OPIS=${OPIS:0:160}
          # Wiersze min= i blokada= steruja OBOWIAZKOWA AKTUALIZACJA, a web= i wygaszenie=
          # - INFORMACJA O PRZEJSCIU NA APLIKACJE WEB (od 3.25.0). Wszystkie zostaja, i to
          # tak, jak czyta je program (_czytaj_wymagania_z_tekstu): kazde wystapienie,
          # w tej samej kolejnosci (przy powtorce program bierze OSTATNIE), bez wzgledu
          # na wielkosc liter i spacje wokol. Do 3.25.0 bot bral tylko pierwsze "^min=" -
          # wciety wiersz (np. skopiowany z wyjscia przygotuj_przejscie.py) znikal po
          # cichu, a przy powtorce wracala stara data.
          KLUCZE=$(tr -d '\r' 2>/dev/null < wersja.txt | grep -iE '^[[:space:]]*(min|blokada|web|wygaszenie)[[:space:]]*=' | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//' || true)
          POWTORZONE=$(printf '%s\n' "$KLUCZE" | sed -E 's/[[:space:]]*=.*//' | tr 'A-Z' 'a-z' | sort | uniq -d | tr '\n' ' ')
          if [ -n "$POWTORZONE" ]; then
            echo "::warning::wersja.txt ma powtorzone wiersze: ${POWTORZONE}- program bierze OSTATNI z kazdego. Zostawiam wszystkie w tej samej kolejnosci; usun stare recznie."
          fi
          printf '%s\r\n%s\r\n' "$NUMER" "$OPIS" > wersja.txt
          if [ -n "$KLUCZE" ]; then
            printf '%s\n' "$KLUCZE" | while IFS= read -r WIERSZ; do printf '%s\r\n' "$WIERSZ"; done >> wersja.txt
          fi
          echo "--- wersja.txt po zapisie ---"; cat wersja.txt
          git config user.name "pmt-bot"
          git config user.email "actions@users.noreply.github.com"
          git add wersja.txt
          git commit -m "wersja.txt -> $NUMER [skip ci]" || { echo "bez zmian"; exit 0; }
          for i in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
          done
          exit 1
