# ============================================================
#  PMT Planer — automatyczne budowanie wydań (Windows / macOS / Linux)
#
#  JAK TO DZIAŁA:
#  1. Wypychasz do repo tag zaczynający się od "v", np.:
#        git tag v3.13.0
#        git push origin v3.13.0
#  2. GitHub sam buduje program na trzech systemach naraz
#     i tworzy wydanie (Release) z trzema plikami:
#        PMT_Planer_Windows.zip   <- bez "mac"/"linux" w nazwie
#        PMT_Planer_macOS.zip     <- zawiera "mac"
#        PMT_Planer_Linux.zip     <- zawiera "linux"
#     Nazwy są DOPASOWANE do funkcji znajdz_plik_wydania() w programie —
#     każdy system pobierze swój plik. Nie zmieniaj ich bez zmiany tamtej
#     funkcji.
#
#  GDZIE WGRAĆ TEN PLIK: .github/workflows/build.yml (dokładnie ta ścieżka)
#
#  UWAGA: budujemy na Pythonie 3.13 (nie 3.14) — celowo, patrz problem
#  z python314.dll na maszynach użytkowników.
# ============================================================
name: Buduj wydanie

on:
  push:
    tags: ["v*"]
  workflow_dispatch:     # ręczne odpalenie z zakładki Actions (do testów)

jobs:
  build:
    strategy:
      fail-fast: false   # awaria buildu na jednym systemie nie ubija pozostałych
      matrix:
        include:
          - os: windows-latest
            nazwa: Windows
            ikona: pmt_logo.ico
            sep: ";"           # separator w --add-data (Windows używa ';')
            binarka: PMT_Planer.exe
          - os: macos-latest   # Apple Silicon (M1/M2/M3...)
            nazwa: macOS
            ikona: pmt_logo.icns
            sep: ":"
            binarka: PMT_Planer
          - os: ubuntu-22.04   # starsze Ubuntu = binarka działa też na starszych dystrybucjach
            nazwa: Linux
            ikona: pmt_logo.png
            sep: ":"
            binarka: PMT_Planer

    runs-on: ${{ matrix.os }}

    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Zainstaluj Pythona 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Zainstaluj zależności
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pyqt6 fpdf2

      # Linux: biblioteki systemowe potrzebne Qt do zbudowania
      - name: Biblioteki systemowe (tylko Linux)
        if: matrix.nazwa == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - name: Zbuduj program
        shell: bash
        run: |
          pyinstaller --onefile --windowed \
            --name PMT_Planer \
            --icon "${{ matrix.ikona }}" \
            --add-data "pmt_logo.png${{ matrix.sep }}." \
            --add-data "pmt_logo.ico${{ matrix.sep }}." \
            PMT_Delegacje.py

      - name: Spakuj do zip
        shell: bash
        run: |
          cd dist
          if [ "${{ matrix.nazwa }}" = "Windows" ]; then
            7z a ../PMT_Planer_Windows.zip PMT_Planer.exe
          else
            # -j = bez ścieżek; zachowuje bit wykonywalności wewnątrz zipa
            zip -j ../PMT_Planer_${{ matrix.nazwa }}.zip ${{ matrix.binarka }}
          fi

      - name: Dołącz do wydania
        uses: softprops/action-gh-release@v2
        with:
          files: PMT_Planer_${{ matrix.nazwa }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
