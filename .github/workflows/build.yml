# ============================================================
#  PMT Planer — automatyczne budowanie wydań (Windows / macOS / Linux)
# ============================================================
name: Buduj wydanie

permissions:
  contents: write

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  # ---------- 1) WINDOWS — buduje się i wysyła jako pierwszy ----------
  windows:
    runs-on: windows-latest
    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Zainstaluj Pythona 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Zainstaluj zależności
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pyqt6 fpdf2 openpyxl

      - name: Zbuduj program
        shell: bash
        run: |
          pyinstaller --onefile --windowed \
            --name PMT_Planer \
            --icon pmt_logo.ico \
            --add-data "pmt_logo.png;." \
            --add-data "pmt_logo.ico;." \
            --add-data "ciemny.png;." \
            --add-data "jasny.png;." \
            PMT_Delegacje.py

      - name: Sprawdź, czy .exe powstał
        shell: bash
        run: |
          test -f dist/PMT_Planer.exe || { echo "BRAK dist/PMT_Planer.exe"; exit 1; }
          ls -la dist/

      - name: Spakuj do zip
        shell: bash
        run: |
          cd dist
          7z a ../PMT_Planer.Windows.zip PMT_Planer.exe
          cd ..
          7z l PMT_Planer.Windows.zip

      - name: Dołącz do wydania
        uses: softprops/action-gh-release@v2
        with:
          files: PMT_Planer.Windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------- 2) macOS i Linux — dopiero po Windows ----------
  pozostale:
    needs: windows
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            nazwa: macOS
            ikona: pmt_logo.icns
          - os: ubuntu-22.04
            nazwa: Linux
            ikona: pmt_logo.png

    runs-on: ${{ matrix.os }}

    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Zainstaluj Pythona 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Zainstaluj zależności
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pyqt6 fpdf2 openpyxl

      - name: Biblioteki systemowe (tylko Linux)
        if: matrix.nazwa == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - name: Zbuduj program
        shell: bash
        run: |
          pyinstaller --onefile --windowed \
            --name PMT_Planer \
            --icon "${{ matrix.ikona }}" \
            --add-data "pmt_logo.png:." \
            --add-data "pmt_logo.ico:." \
            --add-data "ciemny.png:." \
            --add-data "jasny.png:." \
            PMT_Delegacje.py

      - name: Spakuj do zip
        shell: bash
        run: |
          cd dist
          zip -j ../PMT_Planer_${{ matrix.nazwa }}.zip PMT_Planer

      - name: Dołącz do wydania
        uses: softprops/action-gh-release@v2
        with:
          files: PMT_Planer_${{ matrix.nazwa }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
