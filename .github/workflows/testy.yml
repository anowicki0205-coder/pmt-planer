name: Testy

# Uruchamia testy_pmt.py przy kazdej zmianie kodu i przed wydaniem
# (build.yml wywoluje ten plik przez workflow_call przed budowaniem paczki z tagu).
# Cel jest prosty: zeby do wydania nie trafila wersja, ktora nie przechodzi
# wlasnych testow. Trwa okolo trzech minut.

on:
  push:
    branches: ["**"]
    # Wzorce, nie lista plikow: lista gubila moduly pakowane do wydania
    # (nowy_wyglad.py, okno_logowania.py, pmt_wysylka.py, prototyp/...)
    # i build.yml, ktory testy_pmt.py tez sprawdza. "*" nie lapie "/",
    # wiec zmiany w web/ tych testow nie uruchamiaja.
    paths:
      - "*.py"
      - "*.txt"
      - "*.md"
      - "*.gs"
      - "*.bat"
      - "*.sh"
      - "*.png"
      - "*.ico"
      - "*.icns"
      - ".gitignore"
      - "prototyp/**"
      - ".github/workflows/**"
  pull_request:
  workflow_dispatch:
  workflow_call:

# pip uruchamia przy instalacji kod z PyPI - token tylko do odczytu i nie
# zostaje w .git/config (persist-credentials: false), tak jak w build.yml.
permissions:
  contents: read

jobs:
  testy:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Zainstaluj Pythona 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Biblioteki systemowe dla Qt (tryb bez ekranu)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libdbus-1-3 \
                                      libfontconfig1 libxcb-cursor0 libxcb-icccm4 \
                                      libxcb-keysyms1 libxcb-shape0 libxcb-render-util0 \
                                      libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0

      - name: Zainstaluj zaleznosci programu
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Uruchom testy
        env:
          QT_QPA_PLATFORM: offscreen
        run: python testy_pmt.py
