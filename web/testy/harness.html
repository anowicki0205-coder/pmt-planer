<!doctype html><meta charset="utf-8"><title>harness</title>
<script type="module">
import { Silnik } from '../js/silnik.js';
window.S = new Silnik();
window.uruchom = async (p) => {
  const t0 = performance.now(); const log = [];
  await S.start((t, v) => log.push(['start', t, v]));
  const t1 = performance.now();
  const stale = await S.stale();
  const przyg = await S.przygotuj(p);
  const w = await S.generuj(p, (t, v) => log.push(['postep', t, +v.toFixed(2)]));
  return { stale, przyg, log, czasStart: Math.round(t1 - t0), czasGen: Math.round(performance.now() - t1),
           wynik: w.wynik, pdf: w.pdf.map(x => ({ nazwa: x.nazwa, bajtow: x.bajty.byteLength, naglowek: String.fromCharCode(...x.bajty.slice(0, 5)) })) };
};
window.gotowe = true;
</script>
